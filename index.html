<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="./support.js"></script>
    <template id="__bundler_thumbnail" data-bg-color="#E4E9F1">
        <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="st" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(64)"><rect width="2" height="14" fill="rgba(255,255,255,.06)" /></pattern>
                <radialGradient id="gl" cx="15%" cy="50%" r="60%"><stop offset="0" stop-color="rgba(76,108,173,.55)" /><stop offset="1" stop-color="rgba(76,108,173,0)" /></radialGradient>
            </defs>
            <rect width="1200" height="800" fill="#E4E9F1" />
            <rect x="120" y="70" width="960" height="190" rx="28" fill="#161D2A" />
            <rect x="120" y="70" width="960" height="190" rx="28" fill="url(#gl)" />
            <rect x="120" y="70" width="960" height="190" rx="28" fill="url(#st)" />
            <rect x="190" y="138" width="34" height="34" fill="#AFC4E8" transform="rotate(45 207 155)" />
            <text x="260" y="182" font-family="Karla,Arial,sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="4">ETHERIUM</text>
            <g>
                <rect x="120" y="310" width="300" height="300" rx="24" fill="#FFFFFF" stroke="#D3DBE6" stroke-width="2" />
                <rect x="450" y="310" width="300" height="300" rx="24" fill="#FFFFFF" stroke="#D3DBE6" stroke-width="2" />
                <rect x="780" y="310" width="300" height="300" rx="24" fill="#FFFFFF" stroke="#D3DBE6" stroke-width="2" />
                <rect x="150" y="340" width="60" height="60" rx="16" fill="rgba(76,108,173,.14)" />
                <rect x="480" y="340" width="60" height="60" rx="16" fill="rgba(63,143,216,.14)" />
                <rect x="810" y="340" width="60" height="60" rx="16" fill="rgba(139,108,209,.14)" />
                <rect x="150" y="430" width="190" height="22" rx="6" fill="#18222E" />
                <rect x="480" y="430" width="190" height="22" rx="6" fill="#18222E" />
                <rect x="810" y="430" width="190" height="22" rx="6" fill="#18222E" />
                <rect x="150" y="468" width="220" height="13" rx="6" fill="#A3AEBD" />
                <rect x="480" y="468" width="220" height="13" rx="6" fill="#A3AEBD" />
                <rect x="810" y="468" width="220" height="13" rx="6" fill="#A3AEBD" />
                <rect x="150" y="534" width="120" height="38" rx="19" fill="#161D2A" />
                <rect x="480" y="534" width="120" height="38" rx="19" fill="#161D2A" />
                <rect x="810" y="534" width="120" height="38" rx="19" fill="#161D2A" />
            </g>
        </svg>
    </template>
</head>
<body>
    <x-dc>
        <helmet>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
            <style>
                /* ═════ MES OUTILS — thème Etherium V2 (seule l'apparence change) ═════ */
                :root {
                    --fond: #E4E9F1; --carte: #FFFFFF; --beige: #EEF2F8; --beige-band: #F5F7FB;
                    --encre: #161D2A; --titre: #18222E; --texte: #435063; --muet: #7F8EA0;
                    --bordure: #D3DBE6; --filet: #E8ECF3;
                    --accent: #4C6CAD; --accent-clair: #AFC4E8; --accent-fonce: #3A5590;
                    --rayures: repeating-linear-gradient(64deg, rgba(255,255,255,.045) 0 2px, transparent 2px 14px);
                    --glow: radial-gradient(ellipse 60% 140% at 15% 50%, rgba(76,108,173,.4), transparent 70%);
                }
                * { box-sizing: border-box; }
                body {
                    margin: 0;
                    background-color: var(--fond);
                    background-image: radial-gradient(rgba(76, 108, 173, .12) 1px, transparent 1px);
                    background-size: 22px 22px;
                }
                a { text-decoration: none; color: inherit; }

                .hub { font-family: 'Karla', system-ui, sans-serif; color: var(--titre); min-height: 100vh; padding: 0 0 80px; }
                .hub-wrap { max-width: 1000px; margin: 0 auto; padding: 0 26px; }

                /* — bandeau — */
                .hub-top {
                    position: relative; overflow: hidden; margin: 40px 0 30px; padding: 34px 34px 36px; border-radius: 24px;
                    background-color: var(--encre); background-image: var(--rayures), var(--glow);
                    box-shadow: 0 28px 56px -32px rgba(10, 16, 30, .75);
                }
                .hub-top::after {
                    content: ""; position: absolute; right: 46px; top: 50%; width: 120px; height: 120px; margin-top: -60px;
                    transform: rotate(45deg); border: 1.5px solid rgba(175, 196, 232, .28); border-radius: 14px; pointer-events: none;
                }
                .hub-top::before {
                    content: ""; position: absolute; right: 86px; top: 50%; width: 40px; height: 40px; margin-top: -20px;
                    transform: rotate(45deg); background: rgba(175, 196, 232, .14); border-radius: 6px; pointer-events: none;
                }
                .hub-id { display: flex; align-items: center; gap: 18px; position: relative; z-index: 1; }
                .hub-logo { flex: none; width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); }
                .hub-logo i { width: 16px; height: 16px; transform: rotate(45deg); background: var(--accent-clair); box-shadow: 0 0 16px var(--accent-clair); }
                .hub-kick { display: flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 800; letter-spacing: .26em; text-transform: uppercase; color: var(--accent-clair); }
                .hub-title { margin-top: 8px; font-size: 46px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; line-height: 1; color: #FFFFFF; }
                .hub-sub { position: relative; z-index: 1; margin-top: 16px; max-width: 620px; font-size: 15px; line-height: 1.6; color: #B4C0D2; }
                .hub-sub:empty { display: none; }

                /* — grille d'outils — */
                .hub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
                .hub-grid > a { display: block; }
                .tool-card {
                    position: relative; overflow: hidden; height: 100%; display: flex; flex-direction: column; padding: 24px;
                    background: var(--carte); border: 1px solid var(--bordure); border-radius: 20px;
                    box-shadow: 0 16px 34px -26px rgba(10, 16, 30, .45);
                    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
                }
                .tool-card:hover { transform: translateY(-4px); box-shadow: 0 30px 56px -28px rgba(10, 16, 30, .4); border-color: var(--accent-clair); }
                .tc-tint { position: absolute; top: 0; right: 0; width: 140px; height: 140px; pointer-events: none; }
                .tc-bar { position: absolute; left: 0; top: 24px; bottom: 24px; width: 3px; border-radius: 0 3px 3px 0; opacity: .9; }
                .tc-head { display: flex; align-items: center; gap: 13px; margin-bottom: 18px; }
                .tc-icon { flex: none; width: 54px; height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; border: 1px solid; }
                .tc-tag { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 800; letter-spacing: .2em; }
                .tc-tag::before { content: ""; width: 6px; height: 6px; transform: rotate(45deg); background: currentColor; }
                .tc-soon { margin-left: auto; align-self: flex-start; padding: 4px 10px; border-radius: 99px; background: var(--beige); border: 1px solid var(--bordure); color: var(--muet); font-size: 9.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
                .tc-name { font-size: 19px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--titre); }
                .tc-desc { flex: 1; margin-top: 8px; font-size: 13.5px; line-height: 1.6; color: var(--texte); }
                .go {
                    margin-top: 20px; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 99px;
                    background: var(--beige-band); border: 1px solid var(--bordure); color: var(--titre);
                    font-size: 10.5px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase;
                    transition: background .18s ease, color .18s ease, border-color .18s ease;
                }
                .tool-card:hover .go { background: var(--encre); border-color: var(--encre); color: #FFFFFF; }
                .arr { display: inline-block; transition: transform .18s ease; }
                .tool-card:hover .go .arr { transform: translateX(3px); color: var(--accent-clair); }

                .hub-foot { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--bordure); font-size: 12px; line-height: 1.65; color: var(--muet); }
                .hub-foot b { color: var(--texte); }
                .hub-foot a:hover { color: var(--accent); }

                @media (max-width: 600px) {
                    .hub-top { padding: 26px 22px; margin-top: 22px; }
                    .hub-top::before, .hub-top::after { display: none; }
                    .hub-title { font-size: 32px; }
                }
            </style>
        </helmet>

        <div class="hub">
            <div class="hub-wrap">

                <div class="hub-top">
                    <div class="hub-id">
                        <span class="hub-logo"><i></i></span>
                        <div>
                            <div class="hub-kick">{{ kicker }}</div>
                            <div class="hub-title">{{ siteTitle }}</div>
                        </div>
                    </div>
                    <div class="hub-sub">{{ subtitle }}</div>
                </div>

                <div class="hub-grid">
                    <sc-for list="{{ tools }}" as="t" hint-placeholder-count="3">
                        <a href="{{ t.href }}" target="{{ t.target }}">
                            <div class="tool-card" style="opacity:{{ t.opacity }};">
                                <div class="tc-tint" style="background:radial-gradient(circle at top right, {{ t.tint }}, transparent 68%);"></div>
                                <span class="tc-bar" style="background:{{ t.color }};"></span>

                                <div class="tc-head">
                                    <div class="tc-icon" style="background:{{ t.iconBg }}; border-color:{{ t.iconBorder }};">
                                        {{ t.icon }}
                                    </div>
                                    <span class="tc-tag" style="color:{{ t.color }};">{{ t.tag }}</span>
                                    <sc-if value="{{ t.soon }}" hint-placeholder-val="{{ false }}">
                                        <span class="tc-soon">À venir</span>
                                    </sc-if>
                                </div>

                                <div class="tc-name">{{ t.name }}</div>
                                <div class="tc-desc">{{ t.desc }}</div>

                                <div class="go"><span>{{ t.cta }}</span><span class="arr">→</span></div>
                            </div>
                        </a>
                    </sc-for>
                </div>

                <div class="hub-foot">
                    Design par <b><a href="https://codepen.io/kyomeikylas" target="_blank">kylas</a></b> codé avec assistance de <b>Claude Design</b>. Merci de ne pas copier le code source de ces outils pour les réutiliser ailleurs que sur <b><a href="https://etherium.forumactif.com" target="_blank" style="text-decoration:underline;">ETHERIUM POKEMON</a></b>.
                </div>
            </div>
        </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1040, &quot;height&quot;: 720 },
  &quot;kicker&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;ETHERIUM · Pokémon RPG&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;siteTitle&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Mes outils&quot;, &quot;tsType&quot;: &quot;string&quot; }
}">
        class Component extends DCLogic {
          icon(kind, color) {
            const common = { width: 28, height: 28, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' };
            const e = React.createElement;
            if (kind === 'tcard') {
              return e('svg', common,
                e('rect', { x: 3, y: 4, width: 18, height: 16, rx: 2 }),
                e('circle', { cx: 8.5, cy: 9, r: 2 }),
                e('line', { x1: 13, y1: 8, x2: 18, y2: 8 }),
                e('line', { x1: 13, y1: 11, x2: 17, y2: 11 }),
                e('line', { x1: 6, y1: 15, x2: 18, y2: 15 })
              );
            }
            if (kind === 'pc') {
              return e('svg', common,
                e('rect', { x: 3, y: 4, width: 18, height: 13, rx: 2 }),
                e('line', { x1: 8, y1: 20, x2: 16, y2: 20 }),
                e('line', { x1: 12, y1: 17, x2: 12, y2: 20 }),
                e('circle', { cx: 12, cy: 10.5, r: 3 }),
                e('line', { x1: 3, y1: 10.5, x2: 9, y2: 10.5 }),
                e('line', { x1: 15, y1: 10.5, x2: 21, y2: 10.5 })
              );
            }
            if (kind === 'guide') {
              return e('svg', common,
                e('path', { d: 'M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z' }),
                e('line', { x1: 8, y1: 7, x2: 15, y2: 7 }),
                e('line', { x1: 8, y1: 10, x2: 15, y2: 10 })
              );
            }
            if (kind === 'calc') {
              return e('svg', common,
                e('rect', { x: 5, y: 3, width: 14, height: 18, rx: 2 }),
                e('rect', { x: 8, y: 6, width: 8, height: 4, rx: 1 }),
                e('line', { x1: 8.5, y1: 14, x2: 8.5, y2: 14 }),
                e('line', { x1: 12, y1: 14, x2: 12, y2: 14 }),
                e('line', { x1: 15.5, y1: 14, x2: 15.5, y2: 14 }),
                e('line', { x1: 8.5, y1: 17.5, x2: 8.5, y2: 17.5 }),
                e('line', { x1: 12, y1: 17.5, x2: 12, y2: 17.5 }),
                e('line', { x1: 15.5, y1: 17.5, x2: 15.5, y2: 17.5 })
              );
            }
            return e('svg', common,
              e('circle', { cx: 12, cy: 8, r: 4 }),
              e('path', { d: 'M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7' })
            );
          }

          renderVals() {
            const tools = [
              {
                key: 'tcard', tag: 'I', name: 'T-card · Équipe',
                desc: 'Crée et édite ta carte d\'équipe (6 Pokémon max) avec fiches détaillées qui se déroulent au clic.',
                href: 'T-card.html', target: '_self', cta: 'Ouvrir',
                color: '#4C6CAD', iconBg: 'rgba(76,108,173,.10)', iconBorder: 'rgba(76,108,173,.28)', tint: 'rgba(76,108,173,.14)', soon: false, opacity: 1
              },
              {
                key: 'pc', tag: 'II', name: 'PC · Stockage',
                desc: 'Range tes Pokémon dans une boîte de 30 emplacements, thème personnalisable et grille cliquable.',
                href: 'PC.html', target: '_self', cta: 'Ouvrir',
                color: '#3F8FD8', iconBg: 'rgba(63,143,216,.10)', iconBorder: 'rgba(63,143,216,.28)', tint: 'rgba(63,143,216,.14)', soon: false, opacity: 1
              },
              {
                key: 'trainer', tag: 'III', name: 'Carte de dresseur',
                desc: 'Ta fiche de dresseur : identité, rang, talents (T1–T3), CT/CS et inventaire.',
                href: 'Carte dresseur.html', target: '_self', cta: 'Ouvrir',
                color: '#8B6CD1', iconBg: 'rgba(139,108,209,.10)', iconBorder: 'rgba(139,108,209,.28)', tint: 'rgba(139,108,209,.14)', soon: false, opacity: 1
              },
             {
               key: 'guide', tag: 'IV', name: 'Guidebook · Annexes',
               desc: 'Le guide complet du forum : règlement, lore, cartes des étages, groupes, progression et Pokédex.',
               href: 'Guidebook/index.html', target: '_self', cta: 'Ouvrir',
               color: '#3A5590', iconBg: 'rgba(58,85,144,.10)', iconBorder: 'rgba(58,85,144,.28)', tint: 'rgba(58,85,144,.14)', soon: false, opacity: 1
             },
             {
               key: 'calc', tag: 'V', name: 'Calculateur de dégâts',
               desc: 'Choisis l\'attaquant, l\'attaque et le défenseur : les dégâts du combat se calculent tout seuls.',
               href: 'Calculateur.html', target: '_self', cta: 'Ouvrir',
               color: '#C9524A', iconBg: 'rgba(201,82,74,.08)', iconBorder: 'rgba(201,82,74,.26)', tint: 'rgba(201,82,74,.12)', soon: false, opacity: 1
             }
            ].map(t => Object.assign(t, { icon: this.icon(t.key, t.color) }));

            return {
              kicker: this.props.kicker ?? 'ETHERIUM · Pokémon RPG',
              siteTitle: this.props.siteTitle ?? 'Mes outils',
              tools
            };
          }
        }
    </script>
</body>
</html>
