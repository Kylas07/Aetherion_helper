<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tcard-forum.css">
    <script src="equipe-data.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #EFE8DF;
            background-image: radial-gradient(rgba(120, 104, 88, .16) 1px, transparent 1px);
            background-size: 5px 5px;
        }
        a { color: #C7301C; }
        a:hover { color: #93200F; }
        input, select, textarea, button { font-family: 'Archivo', Arial, sans-serif; }
        input, select, textarea { outline: none; color: #1B1918; }
        input:focus, select:focus, textarea:focus { border-color: #E8402A !important; box-shadow: 0 0 0 3px rgba(232, 64, 42, .16); }
        ::placeholder { color: #A69C90; opacity: 1; }
        @media (max-width: 1180px) {
            .ed-grid { grid-template-columns: minmax(0, 1fr) !important; }
            .ed-prev { position: static !important; }
        }
    </style>
</helmet>

<div style="font-family:'Archivo',Arial,sans-serif; color:#1B1918; min-height:100vh; padding:26px 26px 90px;">

    <div style="max-width:1320px; margin:0 auto 20px; background:linear-gradient(180deg,#262322,#161413); border-radius:14px; padding:22px 26px; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;">
        <div>
            <div style="font-family:'Space Mono',monospace; font-size:9.5px; font-weight:700; letter-spacing:.24em; text-transform:uppercase; color:#E8402A;">Outil · générateur</div>
            <div style="font-size:32px; font-weight:800; letter-spacing:-.02em; text-transform:uppercase; line-height:1; margin-top:8px; color:#FFFFFF;">Carte d'équipe</div>
        </div>
    </div>

    <div class="ed-grid" style="max-width:1320px; margin:0 auto; display:grid; grid-template-columns:minmax(0,460px) minmax(0,1fr); gap:24px; align-items:start;">

        <div style="display:flex; flex-direction:column; gap:16px; min-width:0;">

            <div style="background:#FFFFFF; border-radius:12px; padding:16px; box-shadow:0 12px 28px -22px rgba(30,24,20,.4);">
                <div style="font-family:'Space Mono',monospace; font-size:9px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; margin-bottom:8px;">Récupérer une équipe</div>
                <textarea onInput="{{ onLoadInput }}" value="{{ loadInput }}" placeholder="Colle ici le HTML de ta carte d'équipe…" style="width:100%; height:56px; resize:vertical; padding:9px 11px; border:1px solid #E4DBD0; border-radius:9px; background:#FAF7F2; font-family:ui-monospace,monospace; font-size:11px; color:#4A443E; line-height:1.45;"></textarea>
                <div style="display:flex; gap:8px; margin-top:9px;">
                    <button onClick="{{ loadTeam }}" style="flex:1; padding:10px 14px; border:none; border-radius:8px; background:#E8402A; color:#fff; font-family:'Space Mono',monospace; font-weight:700; font-size:11px; letter-spacing:.14em; text-transform:uppercase; text-align:left; cursor:pointer;">Charger</button>
                    <button onClick="{{ resetTeam }}" style="padding:10px 14px; border:1px solid #1B1918; border-radius:8px; background:#FFFFFF; color:#1B1918; font-family:'Space Mono',monospace; font-weight:700; font-size:11px; letter-spacing:.14em; text-transform:uppercase; cursor:pointer;">Exemple</button>
                </div>
            </div>

            <div style="background:#FFFFFF; border-radius:12px; padding:16px; box-shadow:0 12px 28px -22px rgba(30,24,20,.4);">
                <div style="font-family:'Space Mono',monospace; font-size:9px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; margin-bottom:14px;">Réglages</div>
                <label style="display:block; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:#8C837A; font-weight:700; margin-bottom:6px;">Nom du dresseur</label>
                <input value="{{ trainer }}" onChange="{{ onTrainer }}" style="width:100%; padding:9px 11px; border:1px solid #E4DBD0; border-radius:9px; background:#FAF7F2; font-size:13px;">
                <label style="display:flex; align-items:center; gap:10px; margin-top:13px; cursor:pointer; font-size:12.5px; font-weight:600; color:#4A443E;">
                    <input type="checkbox" checked="{{ showNick }}" onChange="{{ onShowNick }}" style="width:17px; height:17px; accent-color:#E8402A; cursor:pointer;">
                    Afficher les surnoms en titre
                </label>
            </div>

            <div style="background:#FFFFFF; border-radius:12px; padding:16px; box-shadow:0 12px 28px -22px rgba(30,24,20,.4);">
                <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px;">
                    <span style="font-family:'Space Mono',monospace; font-size:9px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;">Pokémon</span>
                    <span style="font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:#8C837A;">{{ count }}</span>
                </div>

                <div style="display:flex; flex-direction:column; gap:9px;">
                    <sc-for list="{{ team }}" as="p" hint-placeholder-count="2">
                        <div style="border:1px solid #EDE4D9; border-radius:11px; overflow:hidden; background:{{ p.bg }};">

                            <div onClick="{{ p.toggle }}" style="display:flex; align-items:center; gap:11px; padding:10px 12px; cursor:pointer; user-select:none;">
                                <span style="width:26px; height:26px; border-radius:50%; border:1.5px solid #1B1918; background:{{ p.ballTop }}; flex:none; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff;">{{ p.slot }}</span>
                                <div style="flex:1; min-width:0;">
                                    <div style="font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ p.headTitle }}</div>
                                    <div style="font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:#8C837A; margin-top:2px;">{{ p.headSub }}</div>
                                </div>
                                <button onClick="{{ p.remove }}" title="Supprimer" style="width:28px; height:28px; border-radius:8px; border:1px solid #F0D9D4; background:#FCF1EE; color:#C7301C; font-size:15px; line-height:1; cursor:pointer; flex:none;">×</button>
                                <span style="font-size:17px; color:#A69C90; transform:{{ p.chevron }}; transition:transform .2s; flex:none;">›</span>
                            </div>

                            <sc-if value="{{ p.open }}" hint-placeholder-val="{{ false }}">
                                <div style="padding:2px 12px 14px; border-top:1px solid #EDE4D9; display:flex; flex-direction:column; gap:11px;">

                                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:9px;">
                                        <div>
                                            <label style="display:block; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:#8C837A; font-weight:700; margin-bottom:5px;">Surnom</label>
                                            <input value="{{ p.nickname }}" onChange="{{ p.on.nickname }}" style="width:100%; padding:8px 10px; border:1px solid #E4DBD0; border-radius:8px; background:#FAF7F2; font-size:12.5px;">
                                        </div>
                                        <div>
                                            <label style="display:block; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:#8C837A; font-weight:700; margin-bottom:5px;">Espèce</label>
                                            <input value="{{ p.species }}" onChange="{{ p.on.species }}" style="width:100%; padding:8px 10px; border:1px solid #E4DBD0; border-radius:8px; background:#FAF7F2; font-size:12.5px;">
                                        </div>
                                    </div>

                                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:9px;">
                                        <div>
                                            <label style="display:block; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:#8C837A; font-weight:700; margin-bottom:5px;">Type 1</label>
                                            <select value="{{ p.type0 }}" onChange="{{ p.on.type0 }}" style="width:100%; padding:8px 10px; border:1px solid #E4DBD0; border-radius:8px; background:#FAF7F2; font-size:12.5px;">
                                                <sc-for list="{{ typeOptions }}" as="o" hint-placeholder-count="18"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                                            </select>
                                        </div>
                                        <div>
                                            <label style="display:block; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:#8C837A; font-weight:700; margin-bottom:5px;">Type 2</label>
                                            <select value="{{ p.type1 }}" onChange="{{ p.on.type1 }}" style="width:100%; padding:8px 10px; border:1px solid #E4DBD0; border-radius:8px; background:#FAF7F2; font-size:12.5px;">
                                                <sc-for list="{{ type2Options }}" as="o" hint-placeholder-count="19"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                                            </select>
                                        </div>
                                    </div>

                                    <div style="display:grid; grid-template-columns:78px 1fr 1.2fr; gap:9px;">
                                        <div>
                                            <label style="display:block; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:#8C837A; font-weight:700; margin-bottom:5px;">Niveau</label>
                                            <input value="{{ p.level }}" onChange="{{ p.on.level }}" style="width:100%; padding:8px 10px; border:1px solid #E4DBD0; border-radius:8px; background:#FAF7F2; font-size:12.5px;">
                                        </div>
                                        <div>
                                            <label style="display:block; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:#8C837A; font-weight:700; margin-bottom:5px;">Genre</label>
                                            <select value="{{ p.gender }}" onChange="{{ p.on.gender }}" style="width:100%; padding:8px 10px; border:1px solid #E4DBD0; border-radius:8px; background:#FAF7F2; font-size:12.5px;">
                                                <sc-for list="{{ genderOptions }}" as="o" hint-placeholder-count="3"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                                            </select>
                                        </div>
                                        <div>
                                            <label style="display:block; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:#8C837A; font-weight:700; margin-bottom:5px;">Poké Ball</label>
                                            <select value="{{ p.ball }}" onChange="{{ p.on.ball }}" style="width:100%; padding:8px 10px; border:1px solid #E4DBD0; border-radius:8px; background:#FAF7F2; font-size:12.5px;">
                                                <sc-for list="{{ ballOptions }}" as="o" hint-placeholder-count="14"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                                            </select>
                                        </div>
                                    </div>

                                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:9px;">
                                        <div>
                                            <label style="display:block; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:#8C837A; font-weight:700; margin-bottom:5px;">Talent</label>
                                            <input value="{{ p.talent }}" onChange="{{ p.on.talent }}" style="width:100%; padding:8px 10px; border:1px solid #E4DBD0; border-radius:8px; background:#FAF7F2; font-size:12.5px;">
                                        </div>
                                        <div>
                                            <label style="display:block; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:#8C837A; font-weight:700; margin-bottom:5px;">Nature</label>
                                            <select value="{{ p.nature }}" onChange="{{ p.on.nature }}" style="width:100%; padding:8px 10px; border:1px solid #E4DBD0; border-radius:8px; background:#FAF7F2; font-size:12.5px;">
                                                <sc-for list="{{ natureOptions }}" as="o" hint-placeholder-count="23"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                                            </select>
                                        </div>
                                    </div>

                                    <button onClick="{{ p.toggleHidden }}" style="display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid {{ p.hiddenBorder }}; border-radius:9px; background:{{ p.hiddenBg }}; color:{{ p.hiddenColor }}; font-size:12.5px; font-weight:700; text-align:left; cursor:pointer;">
                                        <span style="width:16px; height:16px; border-radius:4px; border:1.5px solid {{ p.hiddenColor }}; background:{{ p.hiddenMark }}; flex:none;"></span>
                                        Talent caché
                                    </button>

                                    <div>
                                        <label style="display:block; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:#8C837A; font-weight:700; margin-bottom:5px;">Sprite — URL de l'image</label>
                                        <input value="{{ p.sprite }}" onChange="{{ p.on.sprite }}" placeholder="https://…" style="width:100%; padding:8px 10px; border:1px solid #E4DBD0; border-radius:8px; background:#FAF7F2; font-size:12px; color:#4A443E;">
                                    </div>

                                    <div>
                                        <label style="display:block; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:#8C837A; font-weight:700; margin-bottom:7px;">Capacités</label>
                                        <div style="display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto;">
                                            <sc-for list="{{ p.moveRows }}" as="mv" hint-placeholder-count="3">
                                                <div style="display:grid; grid-template-columns:1fr 104px 32px; gap:7px; align-items:start;">
                                                    <input value="{{ mv.name }}" onChange="{{ mv.on.name }}" placeholder="Capacité {{ mv.num }}" style="width:100%; padding:8px 10px; border:1px solid #E4DBD0; border-radius:8px; background:#FAF7F2; font-size:12.5px;">
                                                    <select value="{{ mv.type }}" onChange="{{ mv.on.type }}" style="width:100%; padding:8px 6px; border:1px solid #E4DBD0; border-radius:8px; background:#FAF7F2; font-size:12px;">
                                                        <sc-for list="{{ typeOptions }}" as="o" hint-placeholder-count="18"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                                                    </select>
                                                    <button onClick="{{ mv.remove }}" title="Supprimer" style="height:34px; border:1px solid #F0D9D4; border-radius:8px; background:#FCF1EE; color:#C7301C; font-size:15px; line-height:1; cursor:pointer;">×</button>
                                                    <div style="grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:5px;">
                                                        <sc-for list="{{ mv.sources }}" as="s" hint-placeholder-count="5">
                                                            <button onClick="{{ s.set }}" style="padding:4px 9px; border:1px solid {{ s.border }}; border-radius:6px; background:{{ s.bg }}; color:{{ s.color }}; font-family:'Space Mono',monospace; font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; cursor:pointer;">{{ s.label }}</button>
                                                        </sc-for>
                                                    </div>
                                                </div>
                                            </sc-for>
                                        </div>
                                        <button onClick="{{ p.addMove }}" style="width:100%; margin-top:9px; padding:9px 11px; border:1px dashed #D3C7B8; border-radius:9px; background:#FAF7F2; color:#4A443E; font-family:'Space Mono',monospace; font-weight:700; font-size:10px; letter-spacing:.14em; text-transform:uppercase; text-align:left; cursor:pointer;">+ Ajouter une capacité</button>
                                    </div>

                                    <div>
                                        <label style="display:block; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:#8C837A; font-weight:700; margin-bottom:5px;">Résumé RP</label>
                                        <textarea value="{{ p.desc }}" onChange="{{ p.on.desc }}" placeholder="Caractère, histoire de capture…" style="width:100%; height:72px; resize:vertical; padding:9px 10px; border:1px solid #E4DBD0; border-radius:8px; background:#FAF7F2; font-size:12.5px; line-height:1.55; color:#4A443E;"></textarea>
                                    </div>

                                </div>
                            </sc-if>
                        </div>
                    </sc-for>
                </div>

                <button onClick="{{ addMon }}" style="width:100%; margin-top:11px; padding:11px 13px; border:1px dashed #D3C7B8; border-radius:10px; background:#FAF7F2; color:#4A443E; font-family:'Space Mono',monospace; font-weight:700; font-size:10px; letter-spacing:.14em; text-transform:uppercase; text-align:left; cursor:pointer;">+ Ajouter un Pokémon</button>
            </div>

            <div style="background:linear-gradient(180deg,#262322,#161413); border-radius:12px; padding:18px; color:#EDE7E0;">
                <div style="font-family:'Space Mono',monospace; font-size:9px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; margin-bottom:14px; color:#E8402A;">Exporter</div>
                <div style="display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:7px;">
                    <span style="font-family:'Space Mono',monospace; font-size:8.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:#9C9289;">Code à poster — {{ codeLength }}</span>
                    <button onClick="{{ copyCard }}" style="padding:6px 12px; border:none; border-radius:7px; background:#E8402A; color:#fff; font-family:'Space Mono',monospace; font-weight:700; font-size:10px; letter-spacing:.12em; text-transform:uppercase; cursor:pointer;">Copier</button>
                </div>
                <textarea readOnly value="{{ cardCode }}" style="width:100%; height:76px; resize:vertical; padding:10px 11px; border:1px solid #38332F; border-radius:9px; background:#100F0E; color:#C9C1B8; font-family:ui-monospace,monospace; font-size:10.5px; line-height:1.45;"></textarea>
            </div>

        </div>

        <div class="ed-prev" style="position:sticky; top:24px; min-width:0;">
            <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; padding:0 2px;">
                <span style="font-family:'Space Mono',monospace; font-size:9px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;">Aperçu</span>
                <span style="font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:#8C837A;">rendu réel sur le forum</span>
            </div>
            <div style="width:100%; overflow-x:auto; padding-bottom:10px;">
                <div style="width:650px; max-width:none;">{{ previewNode }}</div>
            </div>
        </div>

    </div>

    <sc-if value="{{ toast.show }}" hint-placeholder-val="{{ false }}">
        <div style="position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:{{ toast.bg }}; color:#fff; padding:12px 20px; border-radius:9px; font-size:13px; font-weight:700; z-index:50;">{{ toast.msg }}</div>
    </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1380,&quot;height&quot;:1000}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const E = window.EQUIPE;
    this.state = {
      data: E ? E.clone(E.DEFAULT) : { trainer: '', showNick: true, team: [] },
      open: 0,
      loadInput: '',
      toast: null
    };
  }

  componentDidMount() {
    if (window.EQUIPE) this.pickup();
    else {
      this._t = setInterval(() => {
        if (window.EQUIPE) {
          clearInterval(this._t);
          this.setState({ data: window.EQUIPE.clone(window.EQUIPE.DEFAULT) });
          this.pickup();
        }
      }, 60);
    }
  }
  componentWillUnmount() { clearInterval(this._t); clearTimeout(this._toastT); }

  /* Récupération automatique : sessionStorage déposé par le forum, puis ?equipe=URL */
  pickup() {
    let html = '';
    try { html = sessionStorage.getItem('aethEquipeHTML') || ''; } catch (e) {}
    if (html) {
      try { sessionStorage.removeItem('aethEquipeHTML'); } catch (e) {}
      if (this.apply(html, 'Équipe récupérée')) return;
    }
    let url = '';
    try { url = new URLSearchParams(location.search).get('equipe') || ''; } catch (e) {}
    if (!url) return;
    fetch(url, { credentials: 'same-origin' })
      .then(r => r.text())
      .then(h => {
        if (!this.apply(h, 'Équipe récupérée depuis le post')) {
          this.toast('Aucune équipe trouvée dans ce post', false);
        }
      })
      .catch(() => this.toast('Récupération impossible — colle le code', false));
  }

  apply(html, label) {
    try {
      this.setState({ data: window.EQUIPE.scanTeam(html), open: 0 });
      this.toast(label, true);
      return true;
    } catch (e) { return false; }
  }

  toast(msg, ok) {
    clearTimeout(this._toastT);
    this.setState({ toast: { show: true, msg, bg: ok ? '#2F6B45' : '#C7301C' } });
    this._toastT = setTimeout(() => this.setState({ toast: null }), 2400);
  }

  set(field, val) { this.setState(s => ({ data: Object.assign({}, s.data, { [field]: val }) })); }

  setMon(i, field, val) {
    this.set('team', this.state.data.team.map((p, j) => j !== i ? p : Object.assign({}, p, { [field]: val })));
  }

  setType(i, slot, val) {
    const p = this.state.data.team[i];
    const t0 = slot === 0 ? (val || 'Normal') : (p.types[0] || 'Normal');
    const t1 = slot === 1 ? val : (p.types[1] || '');
    this.setMon(i, 'types', t1 ? [t0, t1] : [t0]);
  }

  setMove(i, j, field, val) {
    const p = this.state.data.team[i];
    this.setMon(i, 'moves', p.moves.map((m, k) => k !== j ? m : Object.assign({}, m, { [field]: val })));
  }

  addMove(i) {
    const p = this.state.data.team[i];
    this.setMon(i, 'moves', (p.moves || []).concat([{ name: '', type: 'Normal', src: 'n' }]));
  }

  addMon = () => {
    const E = window.EQUIPE;
    if (!E) return;
    this.setState(s => {
      const team = s.data.team.concat([E.blankMon()]);
      return { data: Object.assign({}, s.data, { team }), open: team.length - 1 };
    });
  };

  loadTeam = () => {
    if (!window.EQUIPE) return;
    if (!this.apply(this.state.loadInput, 'Équipe chargée')) {
      this.toast('Aucune équipe détectée dans ce code', false);
    }
  };

  resetTeam = () => {
    const E = window.EQUIPE;
    if (!E) return;
    this.setState({ data: E.clone(E.DEFAULT), open: 0, loadInput: '' });
    this.toast('Exemple chargé', true);
  };

  copy(text, label) {
    if (!text) { this.toast('Rien à copier', false); return; }
    const done = () => this.toast(label + ' copié', true);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => this.fallback(text, done));
    } else this.fallback(text, done);
  }
  fallback(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  renderVals() {
    const E = window.EQUIPE || {};
    const d = this.state.data;
    const showNick = d.showNick !== false;

    const typeOptions = (E.TYPE_LIST || []).map(t => ({ v: t, label: t }));
    const type2Options = [{ v: '', label: '— Aucun —' }].concat(typeOptions);
    const ballOptions = (E.BALL_LIST || []).map(b => ({ v: b, label: b }));
    const natureOptions = (E.NATURES || []).map(n => ({ v: n, label: n }));
    const genderOptions = (E.GENDERS || []).map(g => ({ v: g.v, label: g.label }));

    const team = (d.team || []).map((p, i) => {
      const open = this.state.open === i;
      const bc = E.ballColors ? E.ballColors(p.ball) : { top: '#EE1515' };
      return {
        slot: i + 1,
        nickname: p.nickname || '',
        species: p.species || '',
        type0: (p.types || [])[0] || 'Normal',
        type1: (p.types || [])[1] || '',
        level: p.level == null ? '' : String(p.level),
        gender: p.gender || '♂',
        ball: p.ball || 'Poké Ball',
        talent: p.talent || '',
        nature: p.nature || 'Sérieux',
        sprite: p.sprite || '',
        desc: p.desc || '',
        open,
        bg: open ? '#FAF7F2' : '#FFFFFF',
        chevron: open ? 'rotate(90deg)' : 'rotate(0deg)',
        ballTop: bc.top,
        headTitle: (showNick ? (p.nickname || p.species) : p.species) || 'Nouveau Pokémon',
        headSub: (p.species ? p.species + ' · ' : '') + 'Niv. ' + (p.level || '?') +
          (p.hidden ? ' · talent caché' : ''),
        hiddenBg: p.hidden ? '#6E4FA8' : '#FAF7F2',
        hiddenColor: p.hidden ? '#FFFFFF' : '#4A443E',
        hiddenBorder: p.hidden ? '#6E4FA8' : '#E4DBD0',
        hiddenMark: p.hidden ? '#FFFFFF' : 'transparent',
        toggleHidden: () => this.setMon(i, 'hidden', !p.hidden),
        toggle: () => this.setState(s => ({ open: s.open === i ? -1 : i })),
        remove: (e) => {
          if (e) e.stopPropagation();
          this.setState(s => ({
            data: Object.assign({}, s.data, { team: s.data.team.filter((_, j) => j !== i) }),
            open: s.open === i ? -1 : (s.open > i ? s.open - 1 : s.open)
          }));
        },
        addMove: () => this.addMove(i),
        moveRows: (p.moves || []).map((m, j) => ({
          num: j + 1,
          name: m.name || '',
          type: m.type || 'Normal',
          sources: (E.SOURCES || []).map(s => {
            const on = (m.src || 'n') === s.v;
            return {
              label: s.short,
              set: () => this.setMove(i, j, 'src', s.v),
              bg: on ? '#1B1918' : '#FFFFFF',
              color: on ? '#FFFFFF' : '#8C837A',
              border: on ? '#1B1918' : '#E4DBD0'
            };
          }),
          remove: () => this.setMon(i, 'moves', p.moves.filter((_, k) => k !== j)),
          on: {
            name: (e) => this.setMove(i, j, 'name', e.target.value),
            type: (e) => this.setMove(i, j, 'type', e.target.value)
          }
        })),
        on: {
          nickname: (e) => this.setMon(i, 'nickname', e.target.value),
          species: (e) => this.setMon(i, 'species', e.target.value),
          level: (e) => this.setMon(i, 'level', e.target.value),
          gender: (e) => this.setMon(i, 'gender', e.target.value),
          ball: (e) => this.setMon(i, 'ball', e.target.value),
          talent: (e) => this.setMon(i, 'talent', e.target.value),
          nature: (e) => this.setMon(i, 'nature', e.target.value),
          sprite: (e) => this.setMon(i, 'sprite', e.target.value),
          desc: (e) => this.setMon(i, 'desc', e.target.value),
          type0: (e) => this.setType(i, 0, e.target.value),
          type1: (e) => this.setType(i, 1, e.target.value)
        }
      };
    });

    let cardCode = '', previewNode = null;
    try { if (E.buildHTML) cardCode = E.buildHTML(d, false); } catch (e) {}
    try {
      if (E.buildHTML) {
        previewNode = React.createElement('div', { dangerouslySetInnerHTML: { __html: E.buildHTML(d, true) } });
      }
    } catch (e) {}

    return {
      trainer: d.trainer || '',
      onTrainer: (e) => this.set('trainer', e.target.value),
      showNick,
      onShowNick: (e) => this.set('showNick', e.target.checked),
      count: (d.team || []).length + ' / 6',
      team, typeOptions, type2Options, ballOptions, natureOptions, genderOptions,
      addMon: this.addMon,
      loadInput: this.state.loadInput,
      onLoadInput: (e) => this.setState({ loadInput: e.target.value }),
      loadTeam: this.loadTeam, resetTeam: this.resetTeam,
      cardCode, previewNode,
      codeLength: cardCode.length + ' caractères',
      copyCard: () => this.copy(cardCode, 'Code de la carte'),
      copyCss: () => {
        fetch('tcard-forum.css').then(r => r.text()).then(css => this.copy(css, 'Feuille CSS'))
          .catch(() => this.toast('Feuille CSS introuvable — ouvre tcard-forum.css', false));
      },
      toast: this.state.toast || { show: false, msg: '', bg: '#2F6B45' }
    };
  }
}
</script>
</body>
</html>
