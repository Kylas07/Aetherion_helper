<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tcard-forum.css">
    <script src="equipe-data.js"></script>
    <style>
        /* ═════ GÉNÉRATEUR — thème Etherium V2 (seule l'apparence change) ═════ */
        :root {
            --font: 'Karla';
            --fond: #E4E9F1; --carte: #FFFFFF; --beige: #EEF2F8; --beige-band: #F5F7FB;
            --encre: #161D2A; --titre: #18222E; --texte: #435063; --muet: #7F8EA0;
            --bordure: #D3DBE6; --filet: #E8ECF3;
            --accent: #4C6CAD; --accent-clair: #AFC4E8; --accent-fonce: #3A5590;
            --danger: #C9524A;
            --rayures: repeating-linear-gradient(64deg, rgba(255,255,255,.045) 0 2px, transparent 2px 14px);
            --glow: radial-gradient(ellipse 60% 140% at 15% 50%, rgba(76,108,173,.4), transparent 70%);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: var(--fond);
            background-image: radial-gradient(rgba(76, 108, 173, .12) 1px, transparent 1px);
            background-size: 22px 22px;
        }
        textarea, input, select, button { font-family: 'Karla', Arial, sans-serif; }
        textarea, input, select { outline: none; color: var(--titre); }
        ::placeholder { color: #A3AEBD; opacity: 1; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent) !important; box-shadow: 0 0 0 3px rgba(76, 108, 173, .16); }
        a { color: var(--accent); }
        a:hover { color: var(--accent-fonce); }

        .ed-page { font-family: 'Karla', Arial, sans-serif; color: var(--titre); min-height: 100vh; padding: 26px 26px 80px; }

        /* — bandeau — */
        .ed-top {
            max-width: 1180px; margin: 0 auto 22px; padding: 22px 26px; border-radius: 20px;
            display: flex; align-items: center; gap: 16px;
            background-color: var(--encre); background-image: var(--rayures), var(--glow);
            box-shadow: 0 24px 48px -30px rgba(10, 16, 30, .7);
        }
        .ed-logo { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); }
        .ed-logo i { width: 12px; height: 12px; transform: rotate(45deg); background: var(--accent-clair); box-shadow: 0 0 12px var(--accent-clair); }
        .ed-kick { display: block; font-size: 10px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: var(--accent-clair); }
        .ed-title { display: block; margin-top: 6px; font-size: 26px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; line-height: 1; color: #FFFFFF; }

        .ed-grid { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 26px; align-items: start; }
        .ed-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

        /* — cartes du formulaire — */
        .ed-card { background: var(--carte); border: 1px solid var(--bordure); border-radius: 18px; padding: 18px; box-shadow: 0 16px 34px -26px rgba(10, 16, 30, .45); }
        .ed-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
        .ed-h { display: flex; align-items: center; gap: 9px; font-size: 10px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--titre); }
        .ed-h::before { content: ""; flex: none; width: 7px; height: 7px; transform: rotate(45deg); background: var(--accent); }
        .ed-count { font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--accent); }
        .ed-help { margin: 0 0 10px; font-size: 12px; color: var(--muet); line-height: 1.55; }

        .ed-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .ed-row3 { display: grid; grid-template-columns: 80px 1fr 1.2fr; gap: 10px; }
        .ed-lab { display: block; margin-bottom: 6px; font-size: 9px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
        .ed-in { width: 100%; padding: 9px 11px; border: 1px solid var(--bordure); border-radius: 10px; background: var(--beige-band); font-size: 13px; transition: border-color .15s, box-shadow .15s; }
        .ed-in.white { background: var(--carte); }
        .ed-in.sm { font-size: 12px; color: var(--texte); }
        .ed-ta { width: 100%; resize: vertical; padding: 10px 12px; border: 1px solid var(--bordure); border-radius: 10px; background: var(--beige-band); font-family: ui-monospace, Consolas, monospace; font-size: 11px; line-height: 1.45; color: var(--texte); }

        /* — boutons — */
        .ed-btns { display: flex; gap: 8px; margin-top: 10px; }
        .ed-btn { padding: 11px 16px; border-radius: 99px; font-size: 10.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; transition: filter .15s, border-color .15s, color .15s, background .15s; }
        .ed-btn.main { flex: 1; border: 0; background: var(--accent); color: #FFFFFF; box-shadow: 0 10px 22px -14px var(--accent); }
        .ed-btn.main:hover { filter: brightness(1.08); }
        .ed-btn.alt { border: 1px solid var(--bordure); background: var(--carte); color: var(--titre); }
        .ed-btn.alt:hover { border-color: var(--accent); color: var(--accent); }
        .ed-btn.sm { flex: none; padding: 7px 13px; font-size: 9.5px; }
        .ed-btn.danger { border: 1px solid #F1D6D4; background: #FBEFEE; color: var(--danger); }
        .ed-btn.danger:hover { background: #F6DEDC; }

        /* — la boîte (grille 6 × 5) — */
        .ed-slots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; padding: 10px; border-radius: 14px; background: var(--beige-band); border: 1px solid var(--filet); }
        .ed-slot { position: relative; aspect-ratio: 1; padding: 0; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .12s, border-color .12s; }
        .ed-slot:hover { transform: translateY(-1px); border-color: var(--accent) !important; }
        .ed-slot img { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: pixelated; }
        .ed-ini { font-size: 15px; font-weight: 800; color: var(--muet); }
        .ed-plus { font-size: 17px; font-weight: 400; color: #A3AEBD; }
        .ed-ball { position: absolute; bottom: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #0A0D14; }

        /* — panneau d'édition — */
        .ed-edit { margin-top: 14px; }
        .ed-none { padding: 18px; border: 1.5px dashed var(--bordure); border-radius: 14px; text-align: center; font-size: 12.5px; color: var(--muet); }
        .ed-emptybox { padding: 18px; border: 1.5px dashed var(--bordure); border-radius: 14px; background: var(--beige-band); text-align: center; }
        .ed-emptybox div { margin-bottom: 11px; font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--texte); }
        .ed-emptybox .ed-btn { display: inline-block; }
        .ed-mon { padding: 14px; border-radius: 14px; background: var(--beige); border: 1px solid var(--bordure); box-shadow: inset 3px 0 0 var(--accent); }
        .ed-mon-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .ed-mon-num { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
        .ed-stack { display: flex; flex-direction: column; gap: 11px; }

        /* — export (carte sombre) — */
        .ed-export { border-radius: 18px; padding: 20px; color: #E8EEF7; background-color: var(--encre); background-image: var(--rayures), var(--glow); box-shadow: 0 24px 48px -30px rgba(10, 16, 30, .7); }
        .ed-export .ed-h { color: #FFFFFF; }
        .ed-export .ed-h::before { background: var(--accent-clair); box-shadow: 0 0 10px var(--accent-clair); }
        .ed-xrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 14px 0 8px; }
        .ed-xlab { font-size: 9px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #8E9BAE; }
        .ed-xbtn { padding: 7px 14px; border: 0; border-radius: 99px; background: var(--accent); color: #FFFFFF; font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
        .ed-xbtn:hover { filter: brightness(1.12); }
        .ed-code { width: 100%; height: 76px; resize: vertical; padding: 10px 12px; border: 1px solid rgba(255,255,255,.12); border-radius: 12px; background: rgba(0,0,0,.28); color: #B4C0D2; font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; line-height: 1.45; }

        /* — aperçu — */
        .ed-prev { position: sticky; top: 20px; min-width: 0; }
        .ed-prev .ed-h { margin: 0 2px 14px; }

        .ed-toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); padding: 12px 22px; border-radius: 99px; color: #fff; font-size: 13px; font-weight: 800; box-shadow: 0 16px 34px -16px rgba(10,16,30,.6); z-index: 50; }

        /* — liste de l'équipe (accordéon) — */
        .ed-team { display: flex; flex-direction: column; gap: 9px; }
        .ed-acc { border: 1px solid var(--bordure); border-radius: 14px; overflow: hidden; transition: border-color .15s; }
        .ed-acc:hover { border-color: var(--accent-clair); }
        .ed-acc-h { display: flex; align-items: center; gap: 11px; padding: 10px 12px; cursor: pointer; user-select: none; }
        .ed-num { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--encre); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
        .ed-acc-tx { flex: 1; min-width: 0; }
        .ed-acc-t { font-weight: 800; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--titre); }
        .ed-acc-s { margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muet); }
        .ed-x { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1px solid #F1D6D4; background: #FBEFEE; color: var(--danger); font-size: 15px; line-height: 1; cursor: pointer; }
        .ed-x:hover { background: #F6DEDC; }
        .ed-chev { flex: none; font-size: 17px; color: var(--accent); transition: transform .2s; }
        .ed-acc-b { padding: 12px 12px 14px; border-top: 1px solid var(--filet); display: flex; flex-direction: column; gap: 11px; }
        .ed-in.white { background: var(--carte); }
        .ed-check { display: flex; align-items: center; gap: 10px; margin-top: 13px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--texte); }
        .ed-check input { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
        .ed-hidden { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid; border-radius: 99px; font-size: 12.5px; font-weight: 800; text-align: left; cursor: pointer; transition: background .15s; }
        .ed-hidden span { flex: none; width: 14px; height: 14px; transform: rotate(45deg); border: 1.5px solid; border-radius: 2px; }
        .ed-moves { display: flex; flex-direction: column; gap: 9px; max-height: 300px; overflow-y: auto; }
        .ed-move { display: grid; grid-template-columns: 1fr 108px 32px; gap: 7px; align-items: start; padding-bottom: 9px; border-bottom: 1px dashed var(--filet); }
        .ed-move .ed-x { width: 32px; height: 34px; border-radius: 10px; }
        .ed-srcs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px; }
        .ed-src { padding: 4px 10px; border: 1px solid; border-radius: 99px; font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
        .ed-add { width: 100%; padding: 10px 13px; border: 1.5px dashed var(--accent-clair); border-radius: 12px; background: var(--beige-band); color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; text-align: left; cursor: pointer; transition: background .15s, border-color .15s; }
        .ed-add:hover { background: #E3E9F6; border-color: var(--accent); }
        .ed-prev-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 2px 14px; }
        .ed-prev-h .ed-h { margin: 0; }
        .ed-prev-note { font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muet); }

        @media (max-width: 1100px) {
            .ed-grid { grid-template-columns: minmax(0, 1fr); }
            .ed-prev { position: static; }
        }
    </style>
</helmet>

<div class="ed-page">

    <div class="ed-top">
        <span class="ed-logo"><i></i></span>
        <span>
            <span class="ed-kick">Outil · générateur</span>
            <span class="ed-title">Carte d'équipe</span>
        </span>
    </div>

    <div class="ed-grid">

        <div class="ed-col">

            <div class="ed-card">
                <div class="ed-head"><span class="ed-h">Récupérer une équipe</span></div>
                <textarea class="ed-ta" onInput="{{ onLoadInput }}" value="{{ loadInput }}" placeholder="Colle ici le HTML de ta carte d'équipe…" style="height:58px;"></textarea>
                <div class="ed-btns">
                    <button class="ed-btn main" onClick="{{ loadTeam }}">Charger</button>
                    <button class="ed-btn alt" onClick="{{ resetTeam }}">Exemple</button>
                </div>
            </div>

            <div class="ed-card">
                <div class="ed-head"><span class="ed-h">Réglages</span></div>
                <label class="ed-lab">Nom du dresseur</label>
                <input class="ed-in" value="{{ trainer }}" onChange="{{ onTrainer }}">
                <label class="ed-check">
                    <input type="checkbox" checked="{{ showNick }}" onChange="{{ onShowNick }}">
                    Afficher les surnoms en titre
                </label>
            </div>

            <div class="ed-card">
                <div class="ed-head">
                    <span class="ed-h">Pokémon</span>
                    <span class="ed-count">{{ count }}</span>
                </div>

                <div class="ed-team">
                    <sc-for list="{{ team }}" as="p" hint-placeholder-count="2">
                        <div class="ed-acc" style="background:{{ p.bg }};">

                            <div class="ed-acc-h" onClick="{{ p.toggle }}">
                                <span class="ed-num" style="background:{{ p.ballTop }};">{{ p.slot }}</span>
                                <div class="ed-acc-tx">
                                    <div class="ed-acc-t">{{ p.headTitle }}</div>
                                    <div class="ed-acc-s">{{ p.headSub }}</div>
                                </div>
                                <button class="ed-x" onClick="{{ p.remove }}" title="Supprimer">×</button>
                                <span class="ed-chev" style="transform:{{ p.chevron }};">›</span>
                            </div>

                            <sc-if value="{{ p.open }}" hint-placeholder-val="{{ false }}">
                                <div class="ed-acc-b">

                                    <div class="ed-row2">
                                        <div>
                                            <label class="ed-lab">Surnom</label>
                                            <input class="ed-in" value="{{ p.nickname }}" onChange="{{ p.on.nickname }}">
                                        </div>
                                        <div>
                                            <label class="ed-lab">Espèce</label>
                                            <input class="ed-in" value="{{ p.species }}" onChange="{{ p.on.species }}">
                                        </div>
                                    </div>

                                    <div class="ed-row2">
                                        <div>
                                            <label class="ed-lab">Type 1</label>
                                            <select class="ed-in" value="{{ p.type0 }}" onChange="{{ p.on.type0 }}"><sc-for list="{{ typeOptions }}" as="o" hint-placeholder-count="18"><option value="{{ o.v }}">{{ o.label }}</option></sc-for></select>
                                        </div>
                                        <div>
                                            <label class="ed-lab">Type 2</label>
                                            <select class="ed-in" value="{{ p.type1 }}" onChange="{{ p.on.type1 }}"><sc-for list="{{ type2Options }}" as="o" hint-placeholder-count="19"><option value="{{ o.v }}">{{ o.label }}</option></sc-for></select>
                                        </div>
                                    </div>

                                    <div class="ed-row3">
                                        <div>
                                            <label class="ed-lab">Niveau</label>
                                            <input class="ed-in" value="{{ p.level }}" onChange="{{ p.on.level }}">
                                        </div>
                                        <div>
                                            <label class="ed-lab">Genre</label>
                                            <select class="ed-in" value="{{ p.gender }}" onChange="{{ p.on.gender }}"><sc-for list="{{ genderOptions }}" as="o" hint-placeholder-count="3"><option value="{{ o.v }}">{{ o.label }}</option></sc-for></select>
                                        </div>
                                        <div>
                                            <label class="ed-lab">Poké Ball</label>
                                            <select class="ed-in" value="{{ p.ball }}" onChange="{{ p.on.ball }}"><sc-for list="{{ ballOptions }}" as="o" hint-placeholder-count="14"><option value="{{ o.v }}">{{ o.label }}</option></sc-for></select>
                                        </div>
                                    </div>

                                    <div class="ed-row2">
                                        <div>
                                            <label class="ed-lab">Talent</label>
                                            <input class="ed-in" value="{{ p.talent }}" onChange="{{ p.on.talent }}">
                                        </div>
                                        <div>
                                            <label class="ed-lab">Nature</label>
                                            <select class="ed-in" value="{{ p.nature }}" onChange="{{ p.on.nature }}"><sc-for list="{{ natureOptions }}" as="o" hint-placeholder-count="23"><option value="{{ o.v }}">{{ o.label }}</option></sc-for></select>
                                        </div>
                                    </div>

                                    <button class="ed-hidden" onClick="{{ p.toggleHidden }}" style="border-color:{{ p.hiddenBorder }}; background:{{ p.hiddenBg }}; color:{{ p.hiddenColor }};">
                                        <span style="border-color:{{ p.hiddenColor }}; background:{{ p.hiddenMark }};"></span>
                                        Talent caché
                                    </button>

                                    <div>
                                            <label class="ed-lab">Sprite — URL de l'image</label>
                                        <input class="ed-in sm" value="{{ p.sprite }}" onChange="{{ p.on.sprite }}" placeholder="https://…">
                                    </div>

                                    <div>
                                            <label class="ed-lab">Capacités</label>
                                        <div class="ed-moves">
                                            <sc-for list="{{ p.moveRows }}" as="mv" hint-placeholder-count="3">
                                                <div class="ed-move">
                                                    <input class="ed-in" value="{{ mv.name }}" onChange="{{ mv.on.name }}" placeholder="Capacité {{ mv.num }}">
                                                    <select class="ed-in sm" value="{{ mv.type }}" onChange="{{ mv.on.type }}">
                                                        <sc-for list="{{ typeOptions }}" as="o" hint-placeholder-count="18"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                                                    </select>
                                                    <button class="ed-x" onClick="{{ mv.remove }}" title="Supprimer">×</button>
                                                    <div class="ed-srcs">
                                                        <sc-for list="{{ mv.sources }}" as="s" hint-placeholder-count="5">
                                                            <button class="ed-src" onClick="{{ s.set }}" style="border-color:{{ s.border }}; background:{{ s.bg }}; color:{{ s.color }};">{{ s.label }}</button>
                                                        </sc-for>
                                                    </div>
                                                </div>
                                            </sc-for>
                                        </div>
                                        <button class="ed-add" onClick="{{ p.addMove }}" style="margin-top:9px;">+ Ajouter une capacité</button>
                                    </div>

                                    <div>
                                            <label class="ed-lab">Résumé RP</label>
                                        <textarea class="ed-ta" value="{{ p.desc }}" onChange="{{ p.on.desc }}" placeholder="Caractère, histoire de capture…" style="height:74px; font-family:'Karla',Arial,sans-serif; font-size:12.5px; line-height:1.55;"></textarea>
                                    </div>

                                </div>
                            </sc-if>
                        </div>
                    </sc-for>
                </div>

                <button class="ed-add" onClick="{{ addMon }}" style="margin-top:11px;">+ Ajouter un Pokémon</button>
            </div>

            <div class="ed-export">
                <span class="ed-h">Exporter</span>
                <div class="ed-xrow">
                    <span class="ed-xlab">Code à poster — {{ codeLength }}</span>
                    <button class="ed-xbtn" onClick="{{ copyCard }}">Copier</button>
                </div>
                <textarea class="ed-code" readOnly value="{{ cardCode }}"></textarea>
            </div>

        </div>

        <div class="ed-prev">
            <div class="ed-prev-h">
                <span class="ed-h">Aperçu</span>
                <span class="ed-prev-note">rendu réel sur le forum</span>
            </div>
            <div style="width:100%; overflow-x:auto; padding-bottom:10px;">
                <div style="width:650px; max-width:none;">{{ previewNode }}</div>
            </div>
        </div>

    </div>

    <sc-if value="{{ toast.show }}" hint-placeholder-val="{{ false }}">
        <div class="ed-toast" style="background:{{ toast.bg }};">{{ toast.msg }}</div>
    </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1380,&quot;height&quot;:1000}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const E = window.EQUIPE;
    this.state = {
      data: E ? E.clone(E.DEFAULT) : { trainer: '', showNick: true, team: [] },
      open: 0,
      loadInput: '',
      toast: null
    };
  }

  componentDidMount() {
    if (window.EQUIPE) this.pickup();
    else {
      this._t = setInterval(() => {
        if (window.EQUIPE) {
          clearInterval(this._t);
          this.setState({ data: window.EQUIPE.clone(window.EQUIPE.DEFAULT) });
          this.pickup();
        }
      }, 60);
    }
  }
  componentWillUnmount() { clearInterval(this._t); clearTimeout(this._toastT); }

  /* Récupération automatique : sessionStorage déposé par le forum, puis ?equipe=URL */
  pickup() {
    let html = '';
    try { html = sessionStorage.getItem('aethEquipeHTML') || ''; } catch (e) {}
    if (html) {
      try { sessionStorage.removeItem('aethEquipeHTML'); } catch (e) {}
      if (this.apply(html, 'Équipe récupérée')) return;
    }
    let url = '';
    try { url = new URLSearchParams(location.search).get('equipe') || ''; } catch (e) {}
    if (!url) return;
    fetch(url, { credentials: 'same-origin' })
      .then(r => r.text())
      .then(h => {
        if (!this.apply(h, 'Équipe récupérée depuis le post')) {
          this.toast('Aucune équipe trouvée dans ce post', false);
        }
      })
      .catch(() => this.toast('Récupération impossible — colle le code', false));
  }

  apply(html, label) {
    try {
      this.setState({ data: window.EQUIPE.scanTeam(html), open: 0 });
      this.toast(label, true);
      return true;
    } catch (e) { return false; }
  }

  toast(msg, ok) {
    clearTimeout(this._toastT);
    this.setState({ toast: { show: true, msg, bg: ok ? '#4C6CAD' : '#C9524A' } });
    this._toastT = setTimeout(() => this.setState({ toast: null }), 2400);
  }

  set(field, val) { this.setState(s => ({ data: Object.assign({}, s.data, { [field]: val }) })); }

  setMon(i, field, val) {
    this.set('team', this.state.data.team.map((p, j) => j !== i ? p : Object.assign({}, p, { [field]: val })));
  }

  setType(i, slot, val) {
    const p = this.state.data.team[i];
    const t0 = slot === 0 ? (val || 'Normal') : (p.types[0] || 'Normal');
    const t1 = slot === 1 ? val : (p.types[1] || '');
    this.setMon(i, 'types', t1 ? [t0, t1] : [t0]);
  }

  setMove(i, j, field, val) {
    const p = this.state.data.team[i];
    this.setMon(i, 'moves', p.moves.map((m, k) => k !== j ? m : Object.assign({}, m, { [field]: val })));
  }

  addMove(i) {
    const p = this.state.data.team[i];
    this.setMon(i, 'moves', (p.moves || []).concat([{ name: '', type: 'Normal', src: 'n' }]));
  }

  addMon = () => {
    const E = window.EQUIPE;
    if (!E) return;
    this.setState(s => {
      const team = s.data.team.concat([E.blankMon()]);
      return { data: Object.assign({}, s.data, { team }), open: team.length - 1 };
    });
  };

  loadTeam = () => {
    if (!window.EQUIPE) return;
    if (!this.apply(this.state.loadInput, 'Équipe chargée')) {
      this.toast('Aucune équipe détectée dans ce code', false);
    }
  };

  resetTeam = () => {
    const E = window.EQUIPE;
    if (!E) return;
    this.setState({ data: E.clone(E.DEFAULT), open: 0, loadInput: '' });
    this.toast('Exemple chargé', true);
  };

  copy(text, label) {
    if (!text) { this.toast('Rien à copier', false); return; }
    const done = () => this.toast(label + ' copié', true);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => this.fallback(text, done));
    } else this.fallback(text, done);
  }
  fallback(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  renderVals() {
    const E = window.EQUIPE || {};
    const d = this.state.data;
    const showNick = d.showNick !== false;

    const typeOptions = (E.TYPE_LIST || []).map(t => ({ v: t, label: t }));
    const type2Options = [{ v: '', label: '— Aucun —' }].concat(typeOptions);
    const ballOptions = (E.BALL_LIST || []).map(b => ({ v: b, label: b }));
    const natureOptions = (E.NATURES || []).map(n => ({ v: n, label: n }));
    const genderOptions = (E.GENDERS || []).map(g => ({ v: g.v, label: g.label }));

    const team = (d.team || []).map((p, i) => {
      const open = this.state.open === i;
      const bc = E.ballColors ? E.ballColors(p.ball) : { top: '#EE1515' };
      return {
        slot: i + 1,
        nickname: p.nickname || '',
        species: p.species || '',
        type0: (p.types || [])[0] || 'Normal',
        type1: (p.types || [])[1] || '',
        level: p.level == null ? '' : String(p.level),
        gender: p.gender || '♂',
        ball: p.ball || 'Poké Ball',
        talent: p.talent || '',
        nature: p.nature || 'Sérieux',
        sprite: p.sprite || '',
        desc: p.desc || '',
        open,
        bg: open ? '#F5F7FB' : '#FFFFFF',
        chevron: open ? 'rotate(90deg)' : 'rotate(0deg)',
        ballTop: bc.top,
        headTitle: (showNick ? (p.nickname || p.species) : p.species) || 'Nouveau Pokémon',
        headSub: (p.species ? p.species + ' · ' : '') + 'Niv. ' + (p.level || '?') +
          (p.hidden ? ' · talent caché' : ''),
        hiddenBg: p.hidden ? '#8B6CD1' : '#F5F7FB',
        hiddenColor: p.hidden ? '#FFFFFF' : '#435063',
        hiddenBorder: p.hidden ? '#8B6CD1' : '#D3DBE6',
        hiddenMark: p.hidden ? '#FFFFFF' : 'transparent',
        toggleHidden: () => this.setMon(i, 'hidden', !p.hidden),
        toggle: () => this.setState(s => ({ open: s.open === i ? -1 : i })),
        remove: (e) => {
          if (e) e.stopPropagation();
          this.setState(s => ({
            data: Object.assign({}, s.data, { team: s.data.team.filter((_, j) => j !== i) }),
            open: s.open === i ? -1 : (s.open > i ? s.open - 1 : s.open)
          }));
        },
        addMove: () => this.addMove(i),
        moveRows: (p.moves || []).map((m, j) => ({
          num: j + 1,
          name: m.name || '',
          type: m.type || 'Normal',
          sources: (E.SOURCES || []).map(s => {
            const on = (m.src || 'n') === s.v;
            return {
              label: s.short,
              set: () => this.setMove(i, j, 'src', s.v),
              bg: on ? '#161D2A' : '#FFFFFF',
              color: on ? '#FFFFFF' : '#7F8EA0',
              border: on ? '#161D2A' : '#D3DBE6'
            };
          }),
          remove: () => this.setMon(i, 'moves', p.moves.filter((_, k) => k !== j)),
          on: {
            name: (e) => this.setMove(i, j, 'name', e.target.value),
            type: (e) => this.setMove(i, j, 'type', e.target.value)
          }
        })),
        on: {
          nickname: (e) => this.setMon(i, 'nickname', e.target.value),
          species: (e) => this.setMon(i, 'species', e.target.value),
          level: (e) => this.setMon(i, 'level', e.target.value),
          gender: (e) => this.setMon(i, 'gender', e.target.value),
          ball: (e) => this.setMon(i, 'ball', e.target.value),
          talent: (e) => this.setMon(i, 'talent', e.target.value),
          nature: (e) => this.setMon(i, 'nature', e.target.value),
          sprite: (e) => this.setMon(i, 'sprite', e.target.value),
          desc: (e) => this.setMon(i, 'desc', e.target.value),
          type0: (e) => this.setType(i, 0, e.target.value),
          type1: (e) => this.setType(i, 1, e.target.value)
        }
      };
    });

    let cardCode = '', previewNode = null;
    try { if (E.buildHTML) cardCode = E.buildHTML(d, false); } catch (e) {}
    try {
      if (E.buildHTML) {
        previewNode = React.createElement('div', { dangerouslySetInnerHTML: { __html: E.buildHTML(d, true) } });
      }
    } catch (e) {}

    return {
      trainer: d.trainer || '',
      onTrainer: (e) => this.set('trainer', e.target.value),
      showNick,
      onShowNick: (e) => this.set('showNick', e.target.checked),
      count: (d.team || []).length + ' / 6',
      team, typeOptions, type2Options, ballOptions, natureOptions, genderOptions,
      addMon: this.addMon,
      loadInput: this.state.loadInput,
      onLoadInput: (e) => this.setState({ loadInput: e.target.value }),
      loadTeam: this.loadTeam, resetTeam: this.resetTeam,
      cardCode, previewNode,
      codeLength: cardCode.length + ' caractères',
      copyCard: () => this.copy(cardCode, 'Code de la carte'),
      copyCss: () => {
        fetch('tcard-forum.css').then(r => r.text()).then(css => this.copy(css, 'Feuille CSS'))
          .catch(() => this.toast('Feuille CSS introuvable — ouvre tcard-forum.css', false));
      },
      toast: this.state.toast || { show: false, msg: '', bg: '#4C6CAD' }
    };
  }
}
</script>
</body>
</html>
