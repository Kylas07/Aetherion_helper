<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capture — Guide Aetherion</title>
<style>
/* ══════════════════ STYLE ALIGNÉ SUR LE SOCLE « .adm » DU FORUM ══════════════════
   Les couleurs reprennent les variables du thème (--accent, --encre, --beige…).
   Les valeurs après la virgule ne servent que hors du forum (page isolée). */
:root{
  --accent:#c8502d; --accent-clair:#e8916f; --encre:#1b1714; --blanc:#fff;
  --carte:#fffdf8; --bordure:#e3dbcd; --filet:#e3dbcd;
  --beige:#f6f1e6; --beige-band:#faf6ec; --beige-bordure:#e8e0d0;
  --texte:#3b332c; --texte-doux:#6b6157; --titre:#241f1a; --muet-clair:#a79c8e;
  --shadowCard:0 2px 10px rgba(27,23,20,.07);
  --mono:'Space Mono',ui-monospace,'Courier New',monospace;
  --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--beige);color:var(--texte);font:14px/1.7 var(--sans)}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--titre);text-decoration:underline}
.wrap{max-width:700px;margin:0 auto;padding:22px 16px 80px}

/* ─ Carte (socle .adm) ─ */
.hero,.etape{background:var(--carte);border:1px solid var(--bordure);border-radius:16px;box-shadow:var(--shadowCard);overflow:hidden}
.hero{margin-bottom:0}
.hero .sur{background:var(--encre);border-bottom:2px solid var(--accent);padding:16px 26px;display:flex;align-items:center;gap:12px;
  font:700 19px/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--blanc)}
.hero .sur::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.hero .sur em{font-style:normal;color:var(--accent-clair)}
.hero .intro{padding:22px 26px;font-size:13.5px;line-height:1.7;color:var(--texte-doux);text-align:justify}

/* ─ Rail d'étapes ─ */
.rail{display:flex;gap:8px;margin:16px 0}
.rail span{flex:1;height:4px;border-radius:2px;background:var(--bordure)}
.rail span.on{background:var(--accent)}

/* ─ Étapes ─ */
.etape{display:none}
.etape.on{display:block}
.num{background:var(--encre);border-bottom:2px solid var(--accent);padding:14px 26px;display:flex;align-items:center;gap:12px;
  font:700 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--accent-clair)}
.num::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.etape{padding:0 30px 30px}
.etape .num{margin:0 -30px 0}
.etape h2{position:relative;font:800 26px/1.1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  padding:0 0 12px;margin:26px 0 16px;border-bottom:1px solid var(--filet)}
.etape h2::before{content:"";display:inline-block;width:22px;height:4px;border-radius:2px;background:var(--accent);vertical-align:middle;margin-right:14px}

label.lbl{display:block;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:16px 0 6px}
input[type=text],input[type=url],select,textarea{width:100%;padding:10px 13px;border:1px solid var(--bordure);border-radius:8px;
  background:var(--blanc);color:var(--texte);font:14px var(--sans)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.aide{font-size:12.5px;line-height:1.6;color:var(--texte-doux);margin:8px 0 0;text-align:justify}
.err{display:none;margin:14px 0 0;padding:12px 16px;background:var(--beige-band);border:1px solid var(--accent);border-left-width:3px;
  border-radius:8px;color:var(--accent);font-size:13px}
.err.on{display:block}
.ok-topic{display:none;margin-top:8px;font:700 11px var(--mono);letter-spacing:.06em;color:#4a7a4a}

/* ─ Groupes de talents ─ */
.gtitre{display:flex;justify-content:space-between;gap:10px;background:var(--encre);color:var(--blanc);border-radius:8px;padding:9px 14px;margin:24px 0 10px;
  font:700 11px var(--mono);letter-spacing:.16em;text-transform:uppercase}
.gtitre em{font-style:normal;color:var(--accent-clair)}
.cases{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.case{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;background:var(--beige-band);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;cursor:pointer}
.case:hover{background:var(--beige)}
.case.off{opacity:.5;cursor:not-allowed;border-left-color:var(--bordure)}
.case.off:hover{background:var(--beige-band)}
.case input{margin-top:3px;accent-color:var(--accent)}
.case b{display:block;font-size:13.5px;color:var(--titre)}
.case small{display:block;font-size:12px;line-height:1.5;color:var(--texte-doux)}
.sous{grid-column:1/-1;display:none;padding:12px 16px;background:var(--beige-band);border:1px solid var(--beige-bordure);border-radius:10px}
.sous.on{display:block}
.repousse-liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px;margin-top:6px}
.repousse-liste label{display:flex;gap:7px;align-items:center;font-size:12.5px}

/* ─ Participants ─ */
.part{background:var(--beige-band);border:1px solid var(--beige-bordure);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;padding:16px 20px;margin:0 0 14px}
.part .ptit{display:flex;justify-content:space-between;align-items:center;gap:10px}
.part .ptit b{font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.suppr{background:none;border:1px solid var(--bordure);border-radius:6px;padding:5px 11px;cursor:pointer;
  font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--texte-doux)}
.suppr:hover{border-color:var(--accent);color:var(--accent)}

/* ─ Boutons ─ */
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
button.btn{border:0;border-radius:8px;padding:12px 22px;cursor:pointer;
  font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.btn-p{background:var(--accent);color:var(--blanc)}
.btn-p:hover{background:var(--titre)}
.btn-s{background:var(--beige-band);border:1px solid var(--bordure);color:var(--texte)}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.btn-n{background:var(--encre);color:var(--blanc)}
.btn-n:hover{background:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ─ Récapitulatif (encart clé/valeur .adm-champ) ─ */
.recap{margin:0;display:flex;flex-direction:column;gap:2px}
.recap dt{padding:10px 14px 2px;background:var(--beige-band);border-left:3px solid var(--accent);
  font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.recap dd{margin:0;padding:0 14px 10px;background:var(--beige-band);border-left:3px solid var(--accent);font-size:13.5px;color:var(--texte-doux)}

/* ─ Résultats ─ */
.res-joueur{margin:0 0 20px}
.res-joueur h3{display:flex;gap:10px;align-items:baseline;margin:0 0 10px;
  font:800 16px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--titre)}
.res-joueur h3 small{font:400 11px var(--mono);letter-spacing:0;text-transform:none;color:var(--texte-doux)}
.cartes{display:flex;flex-wrap:wrap;gap:12px}
.carte{width:190px;background:var(--carte);border:1px solid var(--bordure);border-radius:12px;overflow:hidden;position:relative}
.carte.shiny{border-color:var(--accent)}
.carte .cimg{height:96px;display:flex;align-items:center;justify-content:center;background:var(--encre);padding:12px;
  font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-clair)}
.carte .cimg img{max-height:80px;max-width:100%;image-rendering:pixelated}
.carte b{display:block;margin:12px 14px 2px;font-size:14px;color:var(--titre)}
.carte .meta{margin:0 14px 12px;font:11px var(--mono);color:var(--texte-doux)}
.carte .badge-shiny{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--blanc);border-radius:4px;padding:3px 7px;
  font:700 9px var(--mono);letter-spacing:.1em}

/* ─ Journal des jets (bloc code .adm-code) ─ */
.jets{margin:18px 0;border:1px solid var(--bordure);border-radius:10px;overflow:hidden;background:var(--beige-band);
  padding:14px 16px;font:11.5px/1.7 var(--mono);color:var(--texte);white-space:pre-wrap;word-break:break-word}
.jets .t{display:block;margin:-14px -16px 12px;padding:9px 14px;background:var(--encre);color:var(--accent-clair);
  font:700 10px var(--mono);letter-spacing:.16em;text-transform:uppercase}
textarea.bb{height:200px;font:11.5px/1.7 var(--mono);border-radius:10px;background:var(--beige-band);resize:vertical}
.statut{margin-top:12px;font:700 11.5px var(--mono);letter-spacing:.04em}
.statut.ok{color:#4a7a4a}.statut.ko{color:var(--accent)}
@media(max-width:640px){.cases{grid-template-columns:1fr}.etape{padding:0 20px 20px}.etape .num{margin:0 -20px}.etape h2{font-size:21px}}
</style>
</head>

    <div class="nav"><span></span><button class="btn btn-p" onclick="valider1()">Continuer →</button></div>
  </section>

  <!-- ═══════ ÉTAPE 2 · ZONE ═══════ -->
  <section class="etape" data-etape="2">
    <div class="num">02. Zone</div>
    <h2>Zone de capture</h2>
    <label class="lbl" for="f-zone">Choisir la zone</label>
    <select id="f-zone"></select>
    <p class="aide" id="zone-aide"></p>
    <div class="err" id="err2"></div>
    <div class="nav">
      <button class="btn btn-s" onclick="aller(1)">← Retour</button>
      <button class="btn btn-p" onclick="valider2()">Continuer →</button>
    </div>
  </section>

  <!-- ═══════ ÉTAPE 3 · TALENTS DU JOUEUR ═══════ -->
  <section class="etape" data-etape="3">
    <div class="num">03. Talents &amp; objets</div>
    <h2>Tes talents et objets</h2>
    <div id="bloc-joueur"></div>
    <div class="err" id="err3"></div>
    <div class="nav">
      <button class="btn btn-s" onclick="aller(2)">← Retour</button>
      <button class="btn btn-p" onclick="valider3()">Continuer →</button>
    </div>
  </section>

  <!-- ═══════ ÉTAPE 4 · PARTICIPANTS ═══════ -->
  <section class="etape" data-etape="4">
    <div class="num">04. Participants</div>
    <h2>Autres participants <small style="font:400 12px var(--sans);text-transform:none;letter-spacing:0;color:var(--texte-doux)">(optionnel — même sujet RP)</small></h2>
    <div id="bloc-participants"></div>
    <button class="btn btn-s" onclick="ajouterParticipant()">+ Ajouter un participant</button>
    <div class="err" id="err4"></div>
    <div class="nav">
      <button class="btn btn-s" onclick="aller(3)">← Retour</button>
      <button class="btn btn-p" onclick="valider4()">Continuer →</button>
    </div>
  </section>

  <!-- ═══════ ÉTAPE 5 · RÉCAP + LANCER ═══════ -->
  <section class="etape" data-etape="5">
    <div class="num">05. Vérification</div>
    <h2>Récapitulatif</h2>
    <dl class="recap" id="recap"></dl>
    <div class="err" id="err5"></div>
    <div class="nav">
      <button class="btn btn-s" onclick="aller(4)">← Retour</button>
      <button class="btn btn-p" id="btn-lancer" onclick="lancerCapture()">⟡ Lancer la capture</button>
    </div>
  </section>

  <!-- ═══════ RÉSULTATS ═══════ -->
  <section class="etape" data-etape="6">
    <div class="num">Résultat</div>
    <h2>Pokémon rencontrés</h2>
    <div class="statut" id="statut"></div>
    <div id="resultats"></div>
    <div class="jets" id="detail-jets"></div>

    <div class="nav">

      <button class="btn btn-n" onclick="location.reload()">Nouvelle capture</button>
    </div>
  </section>
</div>

/* ─────────── GABARIT DU BLOC D'APPARITION (HTML du forum) ───────────
   Template « adm » du thème. Le texte d'ambiance n'est PAS généré :
   l'espace est laissé vide, l'administrateur le rédige avant de poster. */
/* URL du sprite : champ "img" personnalisé, sinon PokéAPI via le n° national */
function spriteDe(p){
  if (p.entry.img) return p.entry.img;
  if (p.entry.dex) return (p.shiny ? CONFIG.spriteUrlShiny : CONFIG.spriteUrl).replace("{dex}", p.entry.dex);
  return "";
}
function blocApparition(p){
  var sexe = p.sexeLabel === "asexué" ? "asexué" : p.sexeLabel;
  return '<!-- ░░ TEMPLATE : APPARITION ░░ -->\n'
    + '<div class="adm adm--carte">'
    + '<div class="adm-head"><div class="adm-head-t">apparition de <span>' + p.nom.toLowerCase() + (p.shiny ? ' ✦ chromatique' : '') + '</span></div></div>'
    + '<div class="adm-corps"><div class="adm-appar">'
    + '<div class="adm-appar-vis">' + (spriteDe(p)
        ? '<img src="' + spriteDe(p) + '" alt="">'
        : '<!-- sprite manquant : ' + p.nom + ' — n° dex à compléter dans les données de zone -->') + '</div>'
    + '<div class="adm-appar-txt">[texte d\'apparition à rédiger]</div>'
    + '</div></div>'
    + '<div class="adm-foot">niveau ' + CONFIG.niveau + ' <span class="sep">•</span> ' + sexe + '</div>'
    + '</div>';
}

/* Message complet : un bloc par Pokémon + détail intégral du générateur
   (jets, seuils, pools) pour vérification par la modération. */
function gabaritMessage(ctx){
  var L = [];
  ctx.joueurs.forEach(function(j){
    j.pokemons.forEach(function(p){ L.push(blocApparition(p)); });
  });
  L.push("");
  L.push("[spoiler=\"Détail du tirage — " + ctx.zoneLabel + "\"]");
  ctx.joueurs.forEach(function(j){
    L.push("[b]" + j.pseudo + "[/b] — talents/objets déclarés : " + (j.declarations.length ? j.declarations.join(", ") : "aucun"));
    if (j.pokemons.length > 1) L.push("→ " + j.pokemons.length + " apparitions, une seule capturable (règle Miel/Fleur).");
  });
  L.push("");
  ctx.journal.forEach(function(l){ L.push(l); });
  L.push("");
  L.push("Réglages appliqués : shiny base " + Math.round(CONFIG.shinyBase*1000)/10 + " % · Shasseur ×" + CONFIG.shasseurMult + " · Shasseur + ×" + CONFIG.shasseurPlusMult + " · Radar ≤" + CONFIG.radarSeuil + " · Spécialiste ≤" + CONFIG.specSeuil + " / ≤" + CONFIG.specPlusSeuil + ".");
  L.push("[/spoiler]");
  return L.join("\n");
}

function chargerData(){
  try{
    var brut = localStorage.getItem("aetherion_capture_data");
    if (brut){ var d = JSON.parse(brut); if (d && d.zones){ if (d.config) Object.assign(CONFIG, d.config); return d; } }
  }catch(e){ /* localStorage indisponible : on ignore */ }
  return DATA_DEFAUT;
}
// Chargement du JSON hébergé (prioritaire) — asynchrone, remplace DATA si trouvé
if (CONFIG.dataUrl){
  fetch(CONFIG.dataUrl, {cache:"no-store"}).then(function(r){
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function(d){
    if (d && d.zones){ DATA = d; if (d.config) Object.assign(CONFIG, d.config); majZones(); }
  }).catch(function(){ /* échec silencieux : données locales/embarquées conservées */ });
}
// Repli : page HTML avec marqueurs (post caché)
if (CONFIG.dataTopicUrl){
  fetch(CONFIG.dataTopicUrl, {credentials:"same-origin"}).then(function(r){return r.text();}).then(function(html){
    var i = html.indexOf(CONFIG.dataMarqueurDebut), f = html.indexOf(CONFIG.dataMarqueurFin);
    if (i>-1 && f>i){
      var txt = html.slice(i+CONFIG.dataMarqueurDebut.length, f)
        .replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]+>/g,"").replace(/&quot;/g,'"').replace(/&amp;/g,"&");
      var d = JSON.parse(txt);

    }
  }).catch(function(){ /* échec silencieux : données locales conservées */ });
}

/* Liste complète des Pokémon tirables dans une zone (étage → + hordes) */
function poolZone(zoneKey){
  var z = DATA.zones[zoneKey];
  if (!z) return [];
  var p = z.pokemon.slice();
  if (z.type === "etage") p = p.concat(DATA.hordes.map(function(h){ h = Object.assign({}, h); h.horde = true; return h; }));
  return p;
}
function typesZone(zoneKey){
  var t = {};
  poolZone(zoneKey).forEach(function(p){ (p.types||[]).forEach(function(x){ t[x]=1; }); });
  return Object.keys(t).sort();
}
/* Faces du dé : un étage = ses Pokémon (1–27) + la liste de hordes (28…).
   La règle prévoit 14 hordes (1D41) ; si la rotation en compte un autre nombre,
   le dé s'ajuste pour rester cohérent avec le journal des jets. */
function facesZone(zoneKey){
  var z = DATA.zones[zoneKey];
  return z.type === "etage" ? z.pokemon.length + DATA.hordes.length : (z.faces || z.pokemon.length);
}

function extraireTopicId(url){
  // Formats acceptés : /t123-titre, /t123p30-titre, ?t=123, /viewtopic?t=123
  var m = url.match(/\/t(\d+)(?:p\d+)?(?:-|$)/) || url.match(/[?&]t=(\d+)/);
  return m ? parseInt(m[1],10) : null;
}

  var ok = $("topic-ok");

/* offGlobal désactive tout le groupe ; o[3] désactive une option précise */

  }).join("");
}
function arrondi(x){ return Math.round(x*100)/100; }

/* Lit les choix d'un bloc talents → objet participant */
function lireBloc(prefix, pseudo){
  function cb(id){ var e=$(prefix+"-"+id); return e ? e.checked : false; }
  function val(id){ var e=$(prefix+"-"+id); return e ? e.value : ""; }
  function radio(nom){ var e=document.querySelector('input[name="'+prefix+'-'+nom+'"]:checked'); return e ? e.value : "aucun"; }
  var rep = [].slice.call(document.querySelectorAll("."+prefix+"-rep:checked")).map(function(c){ return c.value; });
  return {
    pseudo: pseudo,
    anotherone: cb("anotherone"), unique: cb("unique"),
    radar: cb("radar"), radarCible: val("radar-cible"),
    sonar: cb("sonar"), sonarCible: val("sonar-cible"),
    spec: radio("spec"), specType: val("spec-type"),
    instinct: cb("instinct"), instinctType: val("instinct-type"),
    encens: cb("encens"), encensType: val("encens-type"),
    shass: radio("shass"),
    appat: radio("appat"),
    detecteur: cb("detecteur"),
    scan: radio("scan"),
    repousse: cb("repousse"), repousseListe: rep
  };
}

/* ═══════════════ MOTEUR DE TIRAGE ═══════════════ */

/* Nombre d'apparitions : objet (remplace la base de 1) + Another one */
function nbApparitions(p){
  var base = {aucun:1, miel:2, mielluxe:3, fleur:6}[p.appat] || 1;
  return base + (p.anotherone ? 1 : 0);
}

/* Construit le pool contraint d'un participant (Détecteur ∩ Scanneur ∩ Repousse ∩ Instinct).
   Intersection stricte : si vide → message d'erreur (le joueur doit décocher). */
function poolContraint(p){
  var pool = poolZone(etat.zoneKey);
  if (p.detecteur) pool = pool.filter(function(x){ return x.horde; });
  if (p.scan === "s2") pool = pool.filter(function(x){ return x.stade === 2; });
  if (p.scan === "s3") pool = pool.filter(function(x){ return x.stade === 3; });
  if (p.repousse && p.repousseListe.length) pool = pool.filter(function(x){ return p.repousseListe.indexOf(x.nom) === -1; });
  if (p.instinct) pool = pool.filter(function(x){ return (x.types||[]).indexOf(p.instinctType) > -1; });
  if (p.encens) pool = pool.filter(function(x){ return (x.types||[]).indexOf(p.encensType) > -1; });
  return pool;
}
function verifPool(p){
  if (poolContraint(p).length === 0)
    return "Le cumul Détecteur / Scanneur / Repousse / Maître Spé / Encens Spé ne laisse aucun Pokémon tirable dans cette zone. Décoche une contrainte.";
  return null;
}

/* Tirage : on lance réellement le dé de la zone (1D41 en étage) et on relance
   tant que la face tirée ne correspond pas à un Pokémon du pool autorisé.
   Chaque face vaut ainsi 1/N, conformément à la règle. */
function tirerDansPool(pool, faces, journalRelances){
  faces = faces || facesZone(etat.zoneKey);
  var parFace = {};
  pool.forEach(function(p){ parFace[p.de] = p; });
  for (var i=0; i<400; i++){
    var f = de(faces);
    if (parFace[f]) return { entry: parFace[f], deAffiche: f, relances: i };
    if (journalRelances) journalRelances.push(f);
  }
  // Sécurité : pool minuscule, on prend une entrée au hasard
  var e = pool[Math.floor(Math.random()*pool.length)];
  return { entry: e, deAffiche: e.de, relances: 400 };
}

/* Résout toutes les apparitions d'un participant. journal = tableau de lignes de log. */
function resoudreParticipant(p, journal, dejaTires){
  var pool = poolContraint(p);
  var n = nbApparitions(p);
  var faces = facesZone(etat.zoneKey);
  var resultats = [];
  for (var i=0; i<n; i++){
    var res = null, log = p.pseudo + " · apparition " + (i+1) + "/" + n + " : ";

    // 1) Sonar (1re apparition uniquement) : le Pokémon désigné apparaît, sans jet
    if (i===0 && p.sonar){
      var cible = poolZone(etat.zoneKey).filter(function(x){ return x.nom === p.sonarCible; })[0];
      if (cible){ res = {entry:cible, deAffiche:"Sonar"}; log += "Sonar → " + cible.nom; }
    }
    // 2) Radar-chance (1re apparition uniquement) : 1D100 ≤ seuil
    if (!res && i===0 && p.radar){
      var j = de(100);
      if (j <= CONFIG.radarSeuil){
        var c2 = poolZone(etat.zoneKey).filter(function(x){ return x.nom === p.radarCible; })[0];
        if (c2){ res = {entry:c2, deAffiche:"Radar ("+j+"/"+CONFIG.radarSeuil+")"}; log += "Radar-chance 1D100="+j+" ✓ → "+c2.nom; }
      } else log += "Radar-chance 1D100="+j+" ✗ · ";
    }
    // 3) Spécialiste / Spécialiste + : 1D100 ≤ seuil → tirage restreint au type (dans le pool contraint)
    if (!res && p.spec !== "aucun"){
      var seuil = p.spec === "spec" ? CONFIG.specSeuil : CONFIG.specPlusSeuil;
      var js = de(100);
      var poolType = pool.filter(function(x){ return (x.types||[]).indexOf(p.specType) > -1; });
      if (js <= seuil && poolType.length){
        res = tirerDansPool(poolType);
        log += "Spécialiste 1D100="+js+" ✓ → tirage type "+p.specType+" → dé "+res.deAffiche+" → "+res.entry.nom;
      } else log += "Spécialiste 1D100="+js+(js<=seuil?" ✓ (aucun "+p.specType+" dans le pool)":" ✗")+" · ";
    }
    // 4) Tirage normal dans le pool contraint
    if (!res){
      var rel = [];
      res = tirerDansPool(pool, faces, rel);
      if (rel.length) log += "1D"+faces+" : "+rel.join(", ")+" hors pool → relance · ";
      log += "1D"+faces+"="+res.deAffiche+" → "+res.entry.nom + (res.entry.horde ? " (horde)" : "");
    }

    // 5) Talent de groupe « Unique » : relance des doublons entre tous les tirages
    if (etat.uniqueActif && res.deAffiche !== "Sonar"){
      var essais = 0;
      while (dejaTires.indexOf(res.entry.nom) > -1 && essais < 60){
        var poolSans = pool.filter(function(x){ return dejaTires.indexOf(x.nom) === -1; });
        if (!poolSans.length){ log += " · Unique : plus d'espèce inédite disponible, doublon conservé"; break; }
        res = tirerDansPool(poolSans);
        log += " · Unique : relance → dé "+res.deAffiche+" → "+res.entry.nom;
        essais++;
      }
    }
    dejaTires.push(res.entry.nom);

    // 6) Sexe
    var e = res.entry, sexe, sexeLog = "";
    if (e.genre === "asexue"){ sexe = "asexué"; }
    else if (e.genre === "male"){ sexe = "mâle"; }
    else if (e.genre === "femelle"){ sexe = "femelle"; }
    else if (e.ratioM && e.ratioM !== 50){ var jg = de(100); sexe = jg <= e.ratioM ? "mâle" : "femelle"; sexeLog = " · sexe 1D100="+jg+" (♂ si ≤"+e.ratioM+") → "+sexe; }
    else { var j2 = de(2); sexe = j2 === 1 ? "mâle" : "femelle"; sexeLog = " · sexe 1D2="+j2+" → "+sexe; }

    // 7) Shiny : 1D1000 ≤ taux×1000 (taux de base × multiplicateur Shasseur)
    var taux = CONFIG.shinyBase * (p.shass==="shass" ? CONFIG.shasseurMult : p.shass==="shassplus" ? CONFIG.shasseurPlusMult : 1);
    var seuilShiny = Math.round(taux*1000);
    var jsh = de(1000);
    var shiny = jsh <= seuilShiny;
    log += sexeLog + " · shiny 1D1000="+jsh+" (≤"+seuilShiny+") → " + (shiny ? "★ SHINY" : "non");

    journal.push(log);
    resultats.push({ nom:e.nom, entry:e, sexeLabel:sexe, shiny:shiny, deAffiche:String(res.deAffiche), conserve:false, relache:false });
  }
  return resultats;
}

/* Libellés des talents/objets déclarés (rappel anti-triche dans le message) */
function declarations(p){
  var d = [];
  if (p.anotherone) d.push("Another one");
  if (p.radar) d.push("Radar-chance ("+p.radarCible+")");
  if (p.sonar) d.push("Sonar ("+p.sonarCible+")");
  if (p.spec==="spec") d.push("Spécialiste ("+p.specType+")");
  if (p.spec==="specplus") d.push("Spécialiste + ("+p.specType+")");
  if (p.instinct) d.push("Maître Spé ("+p.instinctType+")");
  if (p.encens) d.push("Encens Spé ("+p.encensType+")");
  if (p.shass==="shass") d.push("Shasseur");
  if (p.shass==="shassplus") d.push("Shasseur +");
  if (p.unique) d.push("Unique");
  if (p.appat==="miel") d.push("Miel");
  if (p.appat==="mielluxe") d.push("Miel de luxe");
  if (p.appat==="fleur") d.push("Fleur Sauvage");
  if (p.detecteur) d.push("Détecteur");
  if (p.scan==="s2") d.push("Scanneur");
  if (p.scan==="s3") d.push("Scanneur +");
  if (p.repousse && p.repousseListe.length) d.push("Repousse ("+p.repousseListe.join(", ")+")");
  return d;
}

/* ─── Étape 5 : lancement ─── */
function lancerCapture(){
  var parts = listeParticipants();
  for (var i=0;i<parts.length;i++){
    var v = verifPool(parts[i]);
    if (v) return erreur("err5", parts[i].pseudo + " : " + v);
  }
  erreur("err5","");
  etat.uniqueActif = parts.some(function(p){ return p.unique; });
  var journal = [], dejaTires = [];
  // Anti-triche : les jets sont définitifs, le code à poster est généré immédiatement
  $("btn-lancer").disabled = true;
  etat.resultat = parts.map(function(p){
    return { participant:p, pokemons:resoudreParticipant(p, journal, dejaTires) };
  });
  etat.journal = journal;
  afficherResultats();
  aller(6);
  var sansSprite = [];
  etat.resultat.forEach(function(r){ r.pokemons.forEach(function(p){ if (!spriteDe(p)) sansSprite.push(p.nom); }); });
  if (sansSprite.length) statut("⚠ Sprite manquant pour : " + sansSprite.join(", ") + " — le bloc est généré sans image, préviens un admin (n° dex à compléter).", false);
  else statut("Copie le code ci-dessous et poste-le dans ton sujet RP.", true);
}

/* ═══════════════ AFFICHAGE DES RÉSULTATS ═══════════════ */
function afficherResultats(){
  var cont = $("resultats"); cont.innerHTML = "";
  etat.resultat.forEach(function(r, ri){
    var div = document.createElement("div"); div.className = "res-joueur";
    var multi = r.pokemons.length > 1;
    div.innerHTML = '<h3>'+echap(r.participant.pseudo)+' <small>'+r.pokemons.length+' apparition(s)'+(multi?' — une seule peut être capturée (choix en RP)':'')+'</small></h3>';
    var cartes = document.createElement("div"); cartes.className = "cartes";
    r.pokemons.forEach(function(p){
      var c = document.createElement("div"); c.className = "carte" + (p.shiny ? " shiny" : "");
      c.innerHTML =
        (p.shiny ? '<span class="badge-shiny">★ SHINY</span>' : '') +
        '<div class="cimg">' + (spriteDe(p) ? '<img src="'+echap(spriteDe(p))+'" alt="">' : 'sprite manquant') + '</div>' +
        '<b>'+echap(p.nom)+'</b>' +
        '<div class="meta">'+p.sexeLabel+' · '+(p.entry.types||[]).join("/")+' · dé '+echap(p.deAffiche)+'</div>';
      cartes.appendChild(c);
    });
    div.appendChild(cartes);
    cont.appendChild(div);
  });
  // Journal des jets (transparence pour la modération)
  $("detail-jets").innerHTML = '<span class="t">JOURNAL DES JETS</span>\n' + etat.journal.map(echap).join("\n");
  majMessage();
}
function majMessage(){
  var ctx = {
    zoneLabel: DATA.zones[etat.zoneKey].label,
    journal: etat.journal,
    joueurs: etat.resultat.map(function(r){
      return { pseudo:r.participant.pseudo, declarations:declarations(r.participant), pokemons:r.pokemons };
    })
  };
  $("bb").value = gabaritMessage(ctx);
}
function copierBB(){
  $("bb").select();
  try{ document.execCommand("copy"); statut("Code copié dans le presse-papiers — poste-le dans ton sujet RP.", true); }
  catch(e){ statut("Copie impossible : sélectionne le texte manuellement.", false); }
}
function statut(msg, ok){
  var s = $("statut"); s.textContent = msg; s.className = "statut " + (ok ? "ok" : "ko");
}

/* ═══════════════ INITIALISATION ═══════════════ */
majZones();
aller(1);


</script>
