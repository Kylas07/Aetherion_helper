<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronologie du jeu — Guide Aetherion</title>
<link href="aetherion-unifie.css" rel="stylesheet" />
</head>
<body>
<!-- MODE D'EMPLOI (pas besoin de savoir coder) :
     • Changer un TEXTE  : récris-le entre les balises, ex <p>ton texte</p>.
       Ne touche pas aux < >, aux "guillemets", ni aux mots anglais.
     • Changer une IMAGE : remplace le lien après  src="  par l'adresse de ton image.
     • Changer un LIEN   : remplace le lien après  href="  par ton adresse.
     • LE MENU DE GAUCHE N'EST PAS DANS CE FICHIER : il est écrit une seule fois
       dans « menu.js ». Modifie-le là-bas, il change sur toutes les pages. -->
<!-- data-page="chrono-jeu" indique au menu quel onglet surligner. -->
<div class="guide" data-page="chrono-jeu">

    <!-- ▼▼▼  CONTENU DE CETTE PAGE  ▼▼▼ -->
    <div class="guide-corps">

        <div class="guide-page actif" id="chrono-jeu">
            <!-- IMAGE DE BANNIÈRE : remplace le lien après src=". Petit texte et grand titre se changent entre les balises. -->
            <div class="guide-hero">
                <img src="https://2img.net/i.imgur.com/OgevXdJ.png" alt="">
                <div class="guide-hero-titre"><small>— 02. Lore</small><b>Chronologie du jeu</b></div>
                <span class="guide-hero-num">02</span>
            </div>
            <div class="guide-section">
                <h2 class="guide-titre">L'<em>histoire</em></h2>
                <!-- FRISE : une ligne = un frise-item (date / titre <b> / texte <p>). Copie une ligne pour en ajouter. -->
                <div class="frise">
                    <div class="frise-item"><span class="frise-date">An 0</span><div class="frise-texte"><b>Élévation des tours</b><p>L'événement fondateur.</p></div></div>
                    <div class="frise-item"><span class="frise-date">An 214</span><div class="frise-texte"><b>Chute des anciennes tours</b><p>Naissance des Brisés.</p></div></div>
                    <div class="frise-item"><span class="frise-date">Aujourd'hui</span><div class="frise-texte"><b>Le présent du jeu</b><p>Où commence votre histoire.</p></div></div>
                </div>
            </div>
        </div>

    </div>
</div>
<script src="menu.js"></script>
</body>
</html>
