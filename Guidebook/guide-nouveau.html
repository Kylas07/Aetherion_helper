<body>
<!-- MODE D'EMPLOI (pas besoin de savoir coder) :
     • Changer un TEXTE  : récris-le entre les balises, ex <p>ton texte</p>.
       Ne touche pas aux < >, aux "guillemets", ni aux mots anglais.
     • Changer une IMAGE : remplace le lien après  src="  par l'adresse de ton image.
     • Changer un LIEN   : remplace le lien après  href="  par ton adresse.
     • LE MENU DE GAUCHE N'EST PAS DANS CE FICHIER : il est écrit une seule fois
       dans « menu.js ». Modifie-le là-bas, il change sur toutes les pages. -->
<!-- data-page="guide-nouveau" indique au menu quel onglet surligner. -->
<div class="guide" data-page="guide-nouveau">

    <!-- ▼▼▼  CONTENU DE CETTE PAGE  ▼▼▼ -->
    <div class="guide-corps">

        <div class="guide-page actif" id="guide-nouveau">
            <!-- IMAGE DE BANNIÈRE : remplace le lien après src=". Petit texte et grand titre se changent entre les balises. -->
            <div class="guide-hero">
                <img src="https://2img.net/i.imgur.com/OgevXdJ.png" alt="">
                <div class="guide-hero-titre"><small>— 01. Accueil</small><b>Guide du nouveau</b></div>
                <span class="guide-hero-num">01</span>
            </div>
            <div class="guide-section">
                <h2 class="guide-titre">Premiers <em>pas</em></h2>
            <div class="guide-bloc"><b>Section</b><p>Les premiers pas : inscription, fiche de personnage, premier RP. À compléter.</p></div>
            </div>
        </div>

    </div>
</div>
<script src="menu.js"></script>
</body>
